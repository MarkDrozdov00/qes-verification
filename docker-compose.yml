services:
  backend:
    build: ./backend
    environment:
      SERVER_PORT: 8080
      ALLOWED_FRONTEND_ORIGIN: http://localhost:5173
      APPLICATION_VERSION: 0.2.0
      VALIDATION_MODE: dss
      TRUST_VALIDATION_ENABLED: "true"
      TRUST_REFRESH_ON_STARTUP: "true"
      TRUST_REFRESH_INTERVAL: 24h
      TRUST_STARTUP_TIMEOUT: 180s
      ONLINE_CERTIFICATE_FETCHING: "true"
      REVOCATION_ENABLED: "true"
      OCSP_ENABLED: "true"
      CRL_ENABLED: "true"
      TRUST_CACHE_DIRECTORY: /app/cache/trusted-lists
      PROTOTYPE_REGISTRY_DIRECTORY: /app/data/notarization-records
      PROTOTYPE_NOTARY_REGISTRY_FILE: /app/data/notaries.json
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/capabilities | grep -q '\"trustedListInitializationComplete\":true'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    volumes:
      - trusted-list-cache:/app/cache/trusted-lists
      - ./data/notarization-records:/app/data/notarization-records:ro
      - ./data/notaries.json:/app/data/notaries.json:ro
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
volumes:
  trusted-list-cache:
